# Shared Vale configuration: the Google developer documentation style.
# Errors fail the check; warnings are shown. Tune noisy rules here, not in the pages.
StylesPath = styles
MinAlertLevel = warning
Packages = Google

[*.md]
BasedOnStyles = Google
# Written for operators who are addressed as "you", and "we" is the project; allow both.
Google.We = NO
# Tables and code carry many short items.
Google.Colons = NO
Google.Headings = suggestion
