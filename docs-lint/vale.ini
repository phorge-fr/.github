# Shared Vale configuration: the Google developer documentation style.
# Errors fail the check; warnings are shown. Tune noisy rules here, not in the pages.
StylesPath = styles
MinAlertLevel = warning
Packages = Google

[*.md]
BasedOnStyles = Google
# Written for operators who are addressed as "you", and "we" is the project; allow both.
Google.We = NO
# Tables and code carry many short items.
Google.Colons = NO
Google.Headings = suggestion
# American quote punctuation puts commas and periods inside quotes; in technical text a quoted string is literal.
Google.Quotes = NO
# The word-list rules suggest replacements that are wrong for technical text: `touch` is a Unix command, `disabled` is a
# configuration state, `application` is an Authentik object, `admin` is a role, `regex` and `firewalls` are common terms.
Google.WordList = NO
Google.WordListCase = NO
