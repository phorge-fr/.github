# Shared lychee configuration. Pull requests check what is on disk (--offline); the scheduled job checks the web.
exclude = [
  '^https?://localhost',
  '^https?://127\.0\.0\.1',
  '^https?://10\.',
  '^https?://192\.168\.',
]
exclude_path = ["templates"]
accept = ["200..=299", "403", "429"]
max_retries = 2
timeout = 20
