name: Feature request
description: Propose new functionality.
type: Feature
assignees: [l-nmch]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations: { required: true }
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations: { required: false }
