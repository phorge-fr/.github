name: Bug report
description: Something does not work as documented.
type: Bug
assignees: [l-nmch]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got.
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
    validations: { required: false }
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Cluster, component, version or commit. No secrets or private addresses.
    validations: { required: false }
  - type: checkboxes
    id: safe
    attributes:
      label: Checks
      options:
        - label: This is not a security vulnerability (those go through SECURITY.md) and contains no secret.
          required: true
