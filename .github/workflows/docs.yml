# Applies the shared documentation checks to this repository itself.
name: docs

on:
  pull_request:
  schedule:
    - cron: "41 5 * * 1"      # Monday: also check the links to the web
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    uses: ./.github/workflows/docs-lint.yml
    with:
      external-links: ${{ github.event_name != 'pull_request' }}
      org-ref: ${{ github.event.pull_request.head.sha || github.sha }}
