# Reusable check: the documentation of a repository follows docs/reference/documentation-standard.md.
# Call it from a repository with:
#
#   on:
#     pull_request:
#   permissions: { contents: read }
#   jobs:
#     docs:
#       uses: phorge-fr/.github/.github/workflows/docs-lint.yml@main
#
# Do not put a `paths:` filter on the trigger: a required check that never reports blocks the merge. The workflow
# decides itself. On a pull request that changes no documentation it reports success at once, without running the tools.
# Documentation is any Markdown file, anything under `docs/`, and the configuration of the check (`docs-lint/`,
# `templates/docs/`, `scripts/check_docs.py`, the `docs*.yml` workflows), except the root `CHANGELOG.md` and `CLAUDE.md`,
# which the Markdown check skips. Every other event (push, schedule, manual run)
# runs the full check.
#
# `external-links: true` also checks the links to the web (use it on a schedule, not on pull requests).
name: docs-lint

on:
  workflow_call:
    inputs:
      external-links:
        type: boolean
        default: false
      org-ref:
        description: Ref of phorge-fr/.github that holds the scripts and configurations
        type: string
        default: main

permissions:
  contents: read

env:
  MARKDOWNLINT_CLI2: 0.23.3
  VALE: 3.24.0
  LYCHEE: 0.24.2

jobs:
  docs:
    name: docs-lint
    runs-on: ubuntu-latest
    steps:
      # Two commits are enough: on a pull request the checkout is the merge commit, whose first parent is the base.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 2

      - name: Does this change touch documentation?
        id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          full() { echo "docs=true" >> "$GITHUB_OUTPUT"; echo "$1: running the full check."; exit 0; }
          [ "$EVENT" = "pull_request" ] || full "Not a pull request"
          git rev-parse --verify --quiet HEAD^2 > /dev/null || full "No merge commit to compare"
          # CHANGELOG.md (release-please) and CLAUDE.md are excluded from the Markdown check below, so they do not count.
          changed="$(git diff -z --name-only --no-renames HEAD^1 HEAD | tr '\0' '\n' | grep -Ev '^(CHANGELOG|CLAUDE)\.md$' || true)"
          pattern='(^|/)[^/]+\.md$|^docs/|^docs-lint/|^templates/docs/|^scripts/check_docs\.py$|^\.github/workflows/docs[^/]*\.yml$'
          if printf '%s\n' "$changed" | grep -Eq "$pattern"; then
            full "Documentation changed"
          fi
          echo "docs=false" >> "$GITHUB_OUTPUT"
          echo "No documentation changed, nothing to check."

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        if: steps.scope.outputs.docs == 'true'
        with:
          repository: phorge-fr/.github
          ref: ${{ inputs.org-ref }}
          path: .org

      - name: Header and layout
        if: steps.scope.outputs.docs == 'true'
        run: python3 -I .org/scripts/check_docs.py .

      - name: Markdown
        if: steps.scope.outputs.docs == 'true'
        run: npx --yes "markdownlint-cli2@${MARKDOWNLINT_CLI2}" --config .org/docs-lint/markdownlint.yaml "docs/**/*.md" "*.md" "!CLAUDE.md" "!CHANGELOG.md"

      - name: Install lychee and Vale
        if: steps.scope.outputs.docs == 'true'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          base="https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE}"
          curl -fsSLO "$base/lychee-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSLO "$base/lychee-x86_64-unknown-linux-gnu.tar.gz.sha256"
          sha256sum -c lychee-x86_64-unknown-linux-gnu.tar.gz.sha256
          tar -xzf lychee-x86_64-unknown-linux-gnu.tar.gz
          base="https://github.com/errata-ai/vale/releases/download/v${VALE}"
          curl -fsSLO "$base/vale_${VALE}_Linux_64-bit.tar.gz"
          curl -fsSLO "$base/vale_${VALE}_checksums.txt"
          grep "vale_${VALE}_Linux_64-bit.tar.gz" "vale_${VALE}_checksums.txt" | sha256sum -c
          tar -xzf "vale_${VALE}_Linux_64-bit.tar.gz" vale
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/lychee-x86_64-unknown-linux-gnu" >> "$GITHUB_PATH"

      - name: Links
        if: steps.scope.outputs.docs == 'true'
        run: |
          flags="--include-fragments --no-progress"
          if [ "${{ inputs.external-links }}" != "true" ]; then flags="$flags --offline"; fi
          # shellcheck disable=SC2086
          lychee $flags --config .org/docs-lint/lychee.toml docs README.md

      - name: Prose
        if: steps.scope.outputs.docs == 'true'
        run: |
          vale --config .org/docs-lint/vale.ini sync
          vale --config .org/docs-lint/vale.ini docs
